name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (must match the selected main or develop branch)
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

# Serialize each environment through health verification and tagging.
concurrency:
  group: cloudflare-${{ (github.event.workflow_run.head_branch || github.ref_name) == 'develop' && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  policy:
    name: Independent deployment policy
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       ((github.ref == 'refs/heads/main' && inputs.target == 'production') ||
        (github.ref == 'refs/heads/develop' && inputs.target == 'staging'))) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.head_branch == 'main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true') ||
        (github.event.workflow_run.head_branch == 'develop' && vars.CLOUDFLARE_STAGING_DEPLOY_ENABLED == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      DEPLOY_TARGET: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'develop' && 'staging' || 'production' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require an immutable reviewed policy revision
        env:
          POLICY_SHA: ${{ vars.GIT_FLOW_POLICY_SHA }}
        run: |
          [[ "$POLICY_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Set GIT_FLOW_POLICY_SHA to the reviewed policy commit.'; exit 1; }
      - name: Check out reviewed policy, never the deployment candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.GIT_FLOW_POLICY_SHA }}
          persist-credentials: false
      - name: Set up the policy runtime without dependency caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Independently verify the accepted PR before any cloud credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deployment-policy.mjs

  deploy:
    name: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'develop' && 'Staging' || 'Production' }}
    needs: policy
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'develop' && 'staging' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      target: ${{ steps.deployment.outputs.target }}
      sha: ${{ steps.deployment.outputs.sha }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      DEPLOY_TARGET: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'develop' && 'staging' || 'production' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate a manually requested deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm audit --package-lock-only --ignore-scripts --audit-level=high
          npm run check
          npm test
          npm run test:smoke
          npm run check:deploy
          npm run check:deploy:staging
      - name: Check target branch and required configuration
        env:
          GH_TOKEN: ${{ github.token }}
          MONSTERTRADE_URL: ${{ vars.MONSTERTRADE_URL }}
          MONSTERTRADE_STAGING_URL: ${{ vars.MONSTERTRADE_STAGING_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_STAGING_DATABASE_ID: ${{ vars.CLOUDFLARE_STAGING_DATABASE_ID }}
        run: node scripts/check-release.mjs
      - name: Check that the production version tag is available
        if: env.DEPLOY_TARGET == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-tag.mjs --check
      - name: Apply migrations and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_STAGING_DATABASE_ID: ${{ vars.CLOUDFLARE_STAGING_DATABASE_ID }}
        run: |
          if [ "$DEPLOY_TARGET" = staging ]; then
            node scripts/deploy.mjs --staging --migrate
          else
            node scripts/deploy.mjs --migrate
          fi
      - name: Verify both deployed database schemas
        env:
          MONSTERTRADE_URL: ${{ vars.MONSTERTRADE_URL }}
          MONSTERTRADE_STAGING_URL: ${{ vars.MONSTERTRADE_STAGING_URL }}
        run: |
          if [ "$DEPLOY_TARGET" = staging ]; then
            export MONSTERTRADE_URL="$MONSTERTRADE_STAGING_URL"
          fi
          node scripts/check-production.mjs
      - name: Record the verified deployment
        id: deployment
        run: |
          echo "target=$DEPLOY_TARGET" >> "$GITHUB_OUTPUT"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag production release
    needs: deploy
    if: needs.deploy.outputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Create a version tag only after the verified deployment.
      contents: write
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Create an immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
        run: node scripts/release-tag.mjs --publish
