name: CI

on:
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-flow:
    name: Git Flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source and commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate branch routing, commit messages, and release versions
        run: node scripts/check-git-flow.mjs

  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source and bundled assets
        run: npm run check
      - name: Run unit and regression tests
        run: npm test
      - name: Verify a fresh local database and Worker
        run: npm run test:smoke
      - name: Validate the Cloudflare deployment bundle
        run: npm run check:deploy
      - name: Validate the isolated staging deployment bundle
        run: npm run check:deploy:staging
